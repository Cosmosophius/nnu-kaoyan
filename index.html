<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#141414">
  <title>汉硕专业课 · 考研知识图谱 (引论/现汉/文化要略)</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    /* ============================================================
       宣纸朱砂 · 中式学术排版
       底色 #F5EFE3 / 卡片 #FCF8EF / 墨 #141414 / 朱砂 #C03024
       ============================================================ */
    :root {
      --paper:        #F5EFE3;
      --paper-card:   #FCF8EF;
      --paper-raise:  #FFFCF5;
      --paper-sunk:   #EFE8DA;

      --ink:          #141414;
      --ink-1:        #3A352E;
      --ink-2:        #5A544B;
      --ink-3:        #8C8578;
      --ink-4:        #B5AD9E;

      --cinnabar:     #C03024;
      --cinnabar-deep:#96251B;
      --cinnabar-wash:#F7E4E1;

      --gold:         #A8894F;
      --gold-wash:    #EFE4CE;

      --bamboo:       #4A6B52;
      --bamboo-wash:  #E4EBE3;

      --rule:         #E0D7C4;
      --rule-soft:    #EBE4D5;

      --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC",
               "STSong", "SimSun", Georgia, "Times New Roman", serif;

      --r-s: 4px;
      --r-m: 6px;
      --r-l: 8px;

      --shadow-1: 0 1px 2px rgba(90,84,75,.07), 0 3px 10px rgba(90,84,75,.045);
      --shadow-2: 0 2px 6px rgba(90,84,75,.10), 0 10px 28px rgba(90,84,75,.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper:        #16150F;
        --paper-card:   #1F1D16;
        --paper-raise:  #26241B;
        --paper-sunk:   #12110C;

        --ink:          #F0E9DA;
        --ink-1:        #DCD4C3;
        --ink-2:        #B8AF9C;
        --ink-3:        #8A8272;
        --ink-4:        #5E574A;

        --cinnabar:     #E0574A;
        --cinnabar-deep:#F0776A;
        --cinnabar-wash:#3A211D;

        --gold:         #C8A868;
        --gold-wash:    #332C1D;

        --bamboo:       #7FA98A;
        --bamboo-wash:  #1E2A22;

        --rule:         #3A362A;
        --rule-soft:    #2C2920;

        --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
        --shadow-2: 0 2px 6px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0; padding: 0;
      font-family: var(--serif);
      background: var(--paper);
      color: var(--ink-1);
      overflow-x: hidden; height: 100vh; display: flex; flex-direction: column;
      letter-spacing: .012em;
      /* 宣纸纤维质感：极淡的斜向纹理 */
      background-image:
        repeating-linear-gradient(92deg,
          rgba(160,150,128,.022) 0 1px, transparent 1px 3px);
    }

    .svg-icon { width: 22px; height: 22px; fill: currentColor; vertical-align: middle; }

    /* ---------- 顶部：深墨横匾 ---------- */
    header.top-app-bar {
      height: 62px; padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--ink);
      color: #F5EFE3;
      flex-shrink: 0; z-index: 100;
      position: relative;
    }
    /* 匾额下沿一道朱砂细线 */
    header.top-app-bar::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 2px; background: var(--cinnabar);
    }
    .app-title-group { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #appHeaderTitle {
      font-size: 18px; font-weight: 600; letter-spacing: .06em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #F5EFE3;
    }
    .icon-btn {
      width: 38px; height: 38px; border-radius: var(--r-s);
      border: none; background: transparent; color: inherit;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background .16s;
    }
    .icon-btn:active { background: rgba(245,239,227,.14); }

    /* 右上角印章式统计 */
    #globalStatBadge {
      flex-shrink: 0;
      font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
      padding: 5px 10px; border-radius: var(--r-s);
      color: #F0C9C3;
      border: 1px solid rgba(192,48,36,.75);
      background: rgba(192,48,36,.16);
      white-space: nowrap;
    }

    /* ---------- 学科切换：书签栏 ---------- */
    .subject-tab-bar {
      display: flex; background: var(--paper-card);
      border-bottom: 1px solid var(--rule);
      padding: 8px 12px; gap: 8px; flex-shrink: 0;
    }
    .subject-btn {
      flex: 1; height: 38px; border-radius: var(--r-s);
      border: 1px solid var(--rule);
      background: transparent; color: var(--ink-2);
      font-family: var(--serif); font-size: 13px; font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all .18s ease;
    }
    .subject-btn:active { transform: scale(.985); }
    .subject-btn.active {
      background: var(--cinnabar);
      color: #FFF8F2;
      border-color: var(--cinnabar);
      box-shadow: 0 1px 4px rgba(192,48,36,.28);
    }

    /* ---------- 视口 ---------- */
    .view-viewport { flex: 1; position: relative; overflow: hidden; width: 100%; }
    .view-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      max-width: 900px; margin: 0 auto; width: 100%;
      transition: transform .26s cubic-bezier(.2,0,0,1), opacity .2s ease;
      will-change: transform, opacity;
      overscroll-behavior: contain;
    }
    .view-screen.hidden-left  { transform: translate3d(-18%,0,0); opacity: 0; pointer-events: none; }
    .view-screen.hidden-right { transform: translate3d(100%,0,0); opacity: 0; pointer-events: none; }

    /* 自定义滚动条 */
    .view-screen::-webkit-scrollbar { width: 6px; }
    .view-screen::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 3px; }
    .view-screen::-webkit-scrollbar-track { background: transparent; }

    /* ---------- 章节卡片：左侧朱砂竖条 ---------- */
    .chapter-card {
      position: relative;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: var(--r-m);
      padding: 16px 18px 16px 22px;
      display: flex; flex-direction: column; gap: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-1);
      transition: transform .16s ease, box-shadow .16s ease, background .16s;
      overflow: hidden;
    }
    .chapter-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--cinnabar); opacity: .85;
    }
    .chapter-card:active {
      transform: scale(.988);
      background: var(--paper-sunk);
      box-shadow: none;
    }
    .ch-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ch-title {
      font-size: 17px; font-weight: 700; line-height: 1.45;
      color: var(--ink); letter-spacing: .02em;
    }
    .ch-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; letter-spacing: .02em; }
    .ch-meta-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* ---------- 标签：印章 / 书签式 ---------- */
    .pill {
      font-size: 11.5px; padding: 3px 8px; border-radius: var(--r-s);
      font-weight: 600; letter-spacing: .02em;
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    /* 真题命中 —— 朱砂实底 */
    .pill-exam {
      background: var(--cinnabar-wash);
      color: var(--cinnabar-deep);
      border-color: rgba(192,48,36,.34);
    }
    /* 小节 */
    .pill-sec {
      background: var(--gold-wash);
      color: var(--gold);
      border-color: rgba(168,137,79,.32);
    }
    /* 考频 / 收录 */
    .pill-score {
      background: var(--paper-sunk);
      color: var(--ink-2);
      border-color: var(--rule);
    }
    /* 题型 */
    .pill-type {
      background: transparent;
      color: var(--ink-3);
      border-color: var(--rule);
    }
    /* DeepSeek 推测 —— 虚线框，明确区分 */
    .pill-ai {
      background: transparent;
      color: var(--gold);
      border: 1px dashed rgba(168,137,79,.72);
    }
    .sec-tag {
      font-size: 11.5px; color: var(--ink-3);
      background: var(--paper-sunk);
      padding: 3px 8px; border-radius: var(--r-s);
      border: 1px solid var(--rule-soft);
      letter-spacing: .02em;
    }
    .section-pills-flow { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ---------- 题目卡片 ---------- */
    .card {
      position: relative;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: var(--r-m);
      padding: 17px 18px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--shadow-1);
    }
    .stem-title {
      font-size: 16.5px; font-weight: 700; line-height: 1.62;
      color: var(--ink); letter-spacing: .015em;
    }

    /* ---------- 选择题选项 ---------- */
    .options-group { display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
    .option-item {
      padding: 10px 14px; border-radius: var(--r-s);
      border: 1px solid var(--rule);
      background: var(--paper-raise);
      font-size: 14.5px; line-height: 1.55; color: var(--ink-1);
      cursor: pointer; transition: all .15s;
      letter-spacing: .015em;
    }
    .option-item:active { background: var(--paper-sunk); }
    .option-item.correct {
      background: var(--bamboo-wash);
      color: var(--bamboo);
      border-color: rgba(74,107,82,.42);
      font-weight: 700;
    }

    /* ---------- 答案区 ---------- */
    .answer-wrapper {
      display: none; padding-top: 12px;
      border-top: 1px dashed var(--rule);
      animation: fadeIn .22s ease;
    }
    .answer-wrapper.show { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .answer-body {
      font-size: 15px; line-height: 1.92; color: var(--ink-2);
      letter-spacing: .015em;
    }
    .points-list {
      margin: 10px 0 0 0; padding-left: 20px;
      display: flex; flex-direction: column; gap: 9px;
    }
    .points-list li { line-height: 1.82; }

    /* ---------- 概念超链接：朱笔圈点 ---------- */
    .concept-link {
      display: inline-block;
      color: var(--cinnabar-deep);
      background: var(--cinnabar-wash);
      font-weight: 700;
      cursor: pointer;
      padding: 0 4px; margin: 0 1px;
      border-radius: 3px;
      border-bottom: 1.5px dotted var(--cinnabar);
      letter-spacing: .01em;
      transition: background .14s, color .14s;
    }
    .concept-link:active {
      background: var(--cinnabar);
      color: #FFF8F2;
      border-bottom-color: transparent;
    }

    /* ---------- 挖空遮罩 ---------- */
    .blank-mask {
      display: inline-block;
      background: var(--gold-wash);
      color: transparent;
      padding: 1px 8px; border-radius: 3px; margin: 0 2px;
      cursor: pointer;
      border-bottom: 1.5px solid var(--gold);
      user-select: none;
      transition: background .16s, color .16s;
    }
    .blank-mask.revealed {
      background: var(--bamboo-wash);
      color: var(--bamboo);
      border-bottom-color: transparent;
      font-weight: 700;
    }

    /* ---------- 展开按钮 ---------- */
    .reveal-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 42px; border-radius: var(--r-s);
      background: var(--paper-sunk);
      color: var(--ink-2);
      border: 1px solid var(--rule);
      font-family: var(--serif);
      font-size: 13.5px; font-weight: 600; letter-spacing: .04em;
      cursor: pointer; transition: all .18s;
    }
    .reveal-btn:active {
      transform: scale(.99);
      background: var(--cinnabar-wash);
      color: var(--cinnabar-deep);
      border-color: rgba(192,48,36,.34);
    }

    /* ---------- 概念抽屉 ---------- */
    .sheet-scrim {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20,20,20,.42); z-index: 500;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
      backdrop-filter: blur(1.5px);
    }
    .sheet-scrim.open { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--paper-card);
      border-top: 2px solid var(--cinnabar);
      border-top-left-radius: var(--r-l); border-top-right-radius: var(--r-l);
      box-shadow: var(--shadow-2);
      max-height: 82vh; display: flex; flex-direction: column;
      transform: translate3d(0, 100%, 0);
      transition: transform .3s cubic-bezier(.1,.9,.2,1);
      z-index: 501; max-width: 680px; margin: 0 auto;
    }
    .bottom-sheet.open { transform: translate3d(0, 0, 0); }

    .sheet-drag-handle {
      width: 34px; height: 3px; border-radius: 2px;
      background: var(--ink-4); margin: 12px auto 6px auto; flex-shrink: 0;
    }
    .sheet-header {
      padding: 8px 20px 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--rule); flex-shrink: 0;
    }
    .sheet-title {
      font-size: 19px; font-weight: 700; color: var(--cinnabar-deep);
      letter-spacing: .04em;
    }
    .sheet-body {
      padding: 20px; overflow-y: auto;
      font-size: 15px; line-height: 1.92; color: var(--ink-2);
      letter-spacing: .015em;
    }
    .sheet-history-bar {
      display: flex; gap: 6px; align-items: center;
      font-size: 12px; color: var(--ink-3);
      padding: 5px 20px; flex-shrink: 0;
      border-bottom: 1px solid var(--rule-soft);
      letter-spacing: .02em;
    }

    /* ---------- 底部导航 ---------- */
    nav.bottom-nav {
      height: 66px;
      background: var(--paper-card);
      border-top: 1px solid var(--rule);
      display: flex; justify-content: space-around; align-items: center;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: transparent; border: none; cursor: pointer;
      color: var(--ink-3);
      font-family: var(--serif);
      font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
      transition: color .18s;
    }
    .nav-indicator {
      width: 52px; height: 30px; border-radius: var(--r-s);
      display: flex; align-items: center; justify-content: center;
      transition: background .18s;
    }
    .nav-item.active { color: var(--cinnabar-deep); }
    .nav-item.active .nav-indicator {
      background: var(--cinnabar-wash);
      box-shadow: inset 0 0 0 1px rgba(192,48,36,.22);
    }

    /* ---------- 筛选栏 ---------- */
    .filter-bar {
      padding: 10px 16px; display: flex; gap: 8px;
      overflow-x: auto; white-space: nowrap; flex-shrink: 0;
      border-bottom: 1px solid var(--rule);
      background: var(--paper-card);
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      border-radius: var(--r-s);
      border: 1px solid var(--rule);
      background: transparent; color: var(--ink-2);
      font-family: var(--serif);
      font-size: 12.5px; font-weight: 600; letter-spacing: .025em;
      cursor: pointer; transition: all .16s;
    }
    .chip.active {
      background: var(--cinnabar-wash);
      color: var(--cinnabar-deep);
      border-color: rgba(192,48,36,.36);
    }
    .chip:active { transform: scale(.98); }

    /* ---------- 杂项 ---------- */
    .hint-line {
      font-size: 12.5px; color: var(--ink-3);
      padding: 4px 2px; letter-spacing: .03em;
    }
    .paper-divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--ink-3); font-size: 12.5px;
      letter-spacing: .1em; font-weight: 600;
      margin: 6px 0 2px;
    }
    .paper-divider::before,
    .paper-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--rule);
    }
  </style>
</head>
<body>

  <!-- 顶部墨色横匾 -->
  <header class="top-app-bar">
    <div class="app-title-group">
      <button class="icon-btn" id="backBtn" style="display:none;" onclick="goBack()">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div id="appHeaderTitle">汉硕知识图谱</div>
    </div>
    <div id="globalStatBadge">共 2131 考点</div>
  </header>

  <!-- 三大学科切换 -->
  <div class="subject-tab-bar">
    <button class="subject-btn active" id="subBtn-yinlun" onclick="switchSubject('yinlun')">
      <span>引论 730</span>
    </button>
    <button class="subject-btn" id="subBtn-xdhy" onclick="switchSubject('xdhy')">
      <span>现汉 902</span>
    </button>
    <button class="subject-btn" id="subBtn-culture" onclick="switchSubject('culture')">
      <span>文化要略 545</span>
    </button>
  </div>

  <!-- 排序与过滤 -->
  <div class="filter-bar" id="practiceFilterBar" style="display:none;">
    <button class="chip active" id="sortFreqBtn" onclick="toggleSort('freq')">
      <svg class="svg-icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>按真题考频</span>
    </button>
    <button class="chip" id="sortSeqBtn" onclick="toggleSort('seq')">
      <svg class="svg-icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span>按教材顺序</span>
    </button>
    <button class="chip" id="filterExamOnlyBtn" onclick="toggleExamOnly()">
      <svg class="svg-icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>仅看真题</span>
    </button>
  </div>

  <!-- 视口 -->
  <div class="view-viewport">
    <div class="view-screen" id="chapterScreen">
      <div class="hint-line" id="chapterSubtitle">点击任意章节进入沉浸式练习</div>
      <div id="chaptersList" style="display:flex;flex-direction:column;gap:11px;"></div>
    </div>

    <div class="view-screen hidden-right" id="examScreen">
      <div class="hint-line" id="examSubtitle">南师大历年真题原卷 · 按试卷罗列</div>
      <div id="examPapersList" style="display:flex;flex-direction:column;gap:11px;"></div>
    </div>

    <div class="view-screen hidden-right" id="practiceScreen">
      <div id="practiceContentList" style="display:flex;flex-direction:column;gap:13px;"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="navRecite" onclick="setMode('recite')">
      <div class="nav-indicator">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm-1 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
      </div>
      <span>背诵</span>
    </button>
    <button class="nav-item" id="navCloze" onclick="setMode('cloze')">
      <div class="nav-indicator">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </div>
      <span>挖空</span>
    </button>
    <button class="nav-item" id="navExam" onclick="setMode('exam')">
      <div class="nav-indicator">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </div>
      <span>真题</span>
    </button>
  </nav>

  <!-- 概念嵌套小窗 -->
  <div class="sheet-scrim" id="sheetScrim" onclick="closeConceptSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="icon-btn" id="sheetBackBtn" style="display:none;width:32px;height:32px;" onclick="popConceptHistory()">
          <svg class="svg-icon" style="width:18px;height:18px;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="sheet-title" id="sheetTermTitle">概念词解</div>
      </div>
      <button class="icon-btn" onclick="closeConceptSheet()">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="sheet-history-bar" id="sheetBreadcrumb" style="display:none;"></div>
    <div class="sheet-body" id="sheetTermBody">正在检索概念释义...</div>
  </div>

  <script>
    let globalData = null;
    let currentSubjectId = 'yinlun';
    let termDict = {};
    let questionMap = {};
    let selectedChapter = null;
    let currentMode = 'recite';
    let sortType = 'freq';
    let examOnly = false;
    let conceptHistory = [];
    let examPapers = [];
    let currentPaper = null;

    const TS = Date.now();
    Promise.all([
      fetch('./data/all_subjects_data.json?t=' + TS).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }),
      fetch('./data/term_index.json?t=' + TS).then(r => r.json()).catch(() => ({ terms: {} })),
      fetch('./data/exam_papers.json?t=' + TS).then(r => r.json()).catch(() => ({ papers: [] }))
    ]).then(([multiData, termData, paperData]) => {
      globalData = multiData;
      termDict = termData.terms || {};
      examPapers = (paperData && paperData.papers) || [];

      Object.values(globalData.questions).forEach(qList => {
        qList.forEach(q => {
          questionMap[q.id] = q;
          if (q.stem && !termDict[q.stem]) {
            termDict[q.stem] = q.id;
          }
        });
      });

      renderCurrentSubjectChapters();
    }).catch(err => {
      console.error('Data load error:', err);
      const chList = document.getElementById('chaptersList');
      if (chList) {
        chList.innerHTML = `
          <div style="text-align:center;padding:40px;color:var(--cinnabar-deep);">
            题库载入异常（${err.message}）<br><br>
            <button class="chip active" onclick="location.reload(true)">点击强制重试</button>
          </div>
        `;
      }
    });

    function switchSubject(subjectId) {
      currentSubjectId = subjectId;
      document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('subBtn-' + subjectId).classList.add('active');

      currentPaper = null;
      document.getElementById('examScreen').classList.add('hidden-right');

      if (currentMode === 'exam') {
        setMode('recite');
      }

      if (selectedChapter) navToChapters();
      renderCurrentSubjectChapters();
    }

    function renderCurrentSubjectChapters() {
      if (!globalData) return;
      const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
      if (!subInfo) return;

      document.getElementById('appHeaderTitle').innerText = subInfo.name;
      document.getElementById('globalStatBadge').innerText =
        `${subInfo.chapters.length} 章 · ${subInfo.total} 考点`;

      // 统计各章 DeepSeek 推测题数量
      const dsByChapter = {};
      (globalData.questions[currentSubjectId] || []).forEach(q => {
        if (q.provenance === 'deepseek') {
          dsByChapter[q.chapter] = (dsByChapter[q.chapter] || 0) + 1;
        }
      });

      const container = document.getElementById('chaptersList');
      container.innerHTML = subInfo.chapters.map((ch) => {
        const sectionsHtml = Object.entries(ch.sections).map(([sName, count]) => {
          return `<span class="sec-tag">${sName}（${count}）</span>`;
        }).join('');
        const dsCount = dsByChapter[ch.chapter] || 0;

        return `
          <div class="chapter-card" onclick="selectChapter('${ch.chapter}')">
            <div class="ch-header">
              <div class="ch-title">${ch.chapter}</div>
              <svg class="svg-icon" style="color:var(--ink-4);width:20px;height:20px;" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
            <div class="ch-meta-row">
              <span class="pill pill-score">收录 ${ch.total} 考点</span>
              ${ch.exam_count ? `<span class="pill pill-exam">真题命中 ${ch.exam_count}</span>` : ''}
              ${dsCount ? `<span class="pill pill-ai">DeepSeek 推测 ${dsCount}</span>` : ''}
              <span class="pill pill-sec">${ch.section_count} 节</span>
            </div>
            <div class="section-pills-flow">${sectionsHtml}</div>
          </div>
        `;
      }).join('');
    }

    // 安全的概念词法高亮（只处理纯文本节点，绝不破坏 HTML 标签）
    function linkifyConcepts(text) {
      if (!text) return '';
      const terms = Object.keys(termDict)
        .filter(t => t.length >= 2 && !['这是','一般','可以','进行','人们','一种','包括','如果','为了','中国','通过','主要'].includes(t))
        .sort((a, b) => b.length - a.length);

      if (terms.length === 0) return text;

      const parts = text.split(/(<[^>]+>)/g);
      const regex = new RegExp(`(${terms.slice(0, 450).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'g');

      return parts.map(part => {
        if (part.startsWith('<') && part.endsWith('>')) return part;
        return part.replace(regex, (m) => `<span class="concept-link" onclick="event.stopPropagation();openConcept('${m}')">${m}</span>`);
      }).join('');
    }

    function openConcept(term) {
      conceptHistory.push(term);
      renderConceptView(term);
      document.getElementById('sheetScrim').classList.add('open');
      document.getElementById('bottomSheet').classList.add('open');
    }

    function renderConceptView(term) {
      const titleEl = document.getElementById('sheetTermTitle');
      const bodyEl = document.getElementById('sheetTermBody');
      const backBtn = document.getElementById('sheetBackBtn');
      const breadcrumb = document.getElementById('sheetBreadcrumb');

      titleEl.innerText = term;
      backBtn.style.display = conceptHistory.length > 1 ? 'inline-flex' : 'none';

      if (conceptHistory.length > 1) {
        breadcrumb.style.display = 'flex';
        breadcrumb.innerText = '路径：' + conceptHistory.join(' → ');
      } else {
        breadcrumb.style.display = 'none';
      }

      const targetId = termDict[term];
      const q = targetId ? questionMap[targetId] : Object.values(questionMap).find(item => item.stem === term);

      if (q) {
        bodyEl.innerHTML = `
          <div style="margin-bottom:10px;">
            <span class="pill pill-score">${q.chapter}</span>
            <span class="pill pill-type">${q.type || '名词解释'}</span>
            ${q.frequency === '高频' ? '<span class="pill pill-exam">高频必背</span>' : ''}
          </div>
          <div style="font-size:17px;font-weight:700;margin-bottom:10px;color:var(--ink);">${q.stem}</div>
          <div style="line-height:1.92;">${linkifyConcepts(q.answer)}</div>
          ${q.answer_points && q.answer_points.length
            ? `<div style="margin-top:16px;font-weight:700;color:var(--cinnabar-deep);letter-spacing:.04em;">核心采分要点</div>
               <ul style="padding-left:20px;margin-top:8px;">${q.answer_points.map(p => `<li>${linkifyConcepts(p)}</li>`).join('')}</ul>`
            : ''}
        `;
      } else {
        bodyEl.innerHTML = `
          <div style="color:var(--ink-3);padding:10px 0;">
            <b style="color:var(--ink-1);">${term}</b> 是汉硕专业课核心考查术语。
            <br><br>建议在教材相关章节中深入理解其与前后概念的联系。
          </div>
        `;
      }
    }

    function popConceptHistory() {
      if (conceptHistory.length > 1) {
        conceptHistory.pop();
        renderConceptView(conceptHistory[conceptHistory.length - 1]);
      }
    }

    function closeConceptSheet() {
      document.getElementById('sheetScrim').classList.remove('open');
      document.getElementById('bottomSheet').classList.remove('open');
      conceptHistory = [];
    }

    function selectChapter(chapterName) {
      selectedChapter = chapterName;
      currentPaper = null;
      document.getElementById('backBtn').style.display = 'inline-flex';
      document.getElementById('appHeaderTitle').innerText = chapterName.split(' ')[0] + ' · 演练';
      document.getElementById('practiceFilterBar').style.display = 'flex';

      document.getElementById('chapterScreen').classList.add('hidden-left');
      document.getElementById('examScreen').classList.add('hidden-right');
      document.getElementById('practiceScreen').classList.remove('hidden-right');

      renderPracticeCards();
    }

    function navToChapters() {
      selectedChapter = null;
      currentPaper = null;
      document.getElementById('backBtn').style.display = 'none';
      const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
      document.getElementById('appHeaderTitle').innerText = subInfo ? subInfo.name : '汉硕知识图谱';
      document.getElementById('practiceFilterBar').style.display = 'none';

      document.getElementById('chapterScreen').classList.remove('hidden-left');
      document.getElementById('practiceScreen').classList.add('hidden-right');
      document.getElementById('examScreen').classList.add('hidden-right');
    }

    function toggleSort(type) {
      sortType = type;
      document.getElementById('sortFreqBtn').classList.toggle('active', type === 'freq');
      document.getElementById('sortSeqBtn').classList.toggle('active', type === 'seq');
      renderPracticeCards();
    }

    function toggleExamOnly() {
      examOnly = !examOnly;
      document.getElementById('filterExamOnlyBtn').classList.toggle('active', examOnly);
      renderPracticeCards();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (mode === 'recite') document.getElementById('navRecite').classList.add('active');
      if (mode === 'cloze')  document.getElementById('navCloze').classList.add('active');
      if (mode === 'exam')   document.getElementById('navExam').classList.add('active');

      if (mode === 'exam') {
        navToExamPapers();
        return;
      }

      if (!selectedChapter && globalData) {
        const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
        if (subInfo && subInfo.chapters.length) selectChapter(subInfo.chapters[0].chapter);
      } else {
        renderPracticeCards();
      }
    }

    // ---------- 按试卷罗列真题 ----------
    function navToExamPapers() {
      selectedChapter = null;
      currentPaper = null;
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('practiceFilterBar').style.display = 'none';
      document.getElementById('appHeaderTitle').innerText = '南师大真题原卷';
      document.getElementById('globalStatBadge').innerText =
        examPapers.length + ' 份 · ' +
        examPapers.reduce((n, p) => n + p.sections.reduce((m, s) => m + s.questions.length, 0), 0) + ' 题';

      renderExamPapers();

      document.getElementById('chapterScreen').classList.add('hidden-left');
      document.getElementById('practiceScreen').classList.add('hidden-right');
      document.getElementById('examScreen').classList.remove('hidden-right');
    }

    function renderExamPapers() {
      const box = document.getElementById('examPapersList');
      if (!examPapers.length) {
        box.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-3);">暂未解析到真题试卷数据。</div>';
        return;
      }

      const byYear = {};
      examPapers.forEach(p => { (byYear[p.year] = byYear[p.year] || []).push(p); });
      const years = Object.keys(byYear).sort((a, b) => b - a);

      box.innerHTML = years.map(y => {
        const items = byYear[y].map(p => {
          const total = p.sections.reduce((n, s) => n + s.questions.length, 0);
          const is354 = p.code === '354';
          return `
            <div class="chapter-card" onclick="openPaper('${p.id}')">
              <div class="ch-header">
                <div>
                  <div class="ch-title">${p.code} ${p.subject}</div>
                  <div class="ch-sub">${p.sections.length} 个大题 · ${total} 道小题</div>
                </div>
                <span class="pill ${is354 ? 'pill-type' : 'pill-exam'}">${p.code}</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="paper-divider">${y} 年</div>
          <div style="display:flex;flex-direction:column;gap:11px;">${items}</div>
        `;
      }).join('');
    }

    function openPaper(paperId) {
      const paper = examPapers.find(p => p.id === paperId);
      if (!paper) return;
      currentPaper = paper;
      currentMode = 'exam';

      document.getElementById('backBtn').style.display = 'inline-flex';
      document.getElementById('appHeaderTitle').innerText = paper.year + ' · ' + paper.code;
      document.getElementById('practiceFilterBar').style.display = 'none';
      document.getElementById('globalStatBadge').innerText =
        paper.sections.reduce((n, s) => n + s.questions.length, 0) + ' 题';

      renderPaperView(paper);

      document.getElementById('examScreen').classList.add('hidden-right');
      document.getElementById('chapterScreen').classList.add('hidden-left');
      document.getElementById('practiceScreen').classList.remove('hidden-right');
    }

    function renderPaperView(paper) {
      const container = document.getElementById('practiceContentList');
      let seq = 0;

      container.innerHTML = `
        <div class="card" style="background:var(--paper-sunk);border-color:var(--rule);">
          <div class="stem-title" style="color:var(--cinnabar-deep);">${paper.title}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:2px;letter-spacing:.03em;">
            按原卷大题顺序罗列 · 共 ${paper.sections.length} 个大题
          </div>
        </div>
      ` + paper.sections.map(sec => {
        const head = `
          <div style="margin-top:10px;padding:10px 14px;
                      border-left:3px solid var(--cinnabar);
                      background:var(--paper-sunk);
                      border-radius:0 var(--r-s) var(--r-s) 0;">
            <div style="font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:.02em;">${sec.name}</div>
            ${sec.score ? `<div style="font-size:12px;color:var(--ink-3);margin-top:3px;">${sec.score}</div>` : ''}
          </div>
        `;

        const qs = sec.questions.map(q => {
          seq += 1;
          const cid = 'p-' + paper.id + '-' + seq;
          const ref = q.ref || null;
          const missing = q.missing;

          let ansHtml = '';
          if (missing) {
            ansHtml = `<div style="font-size:13px;color:var(--ink-3);">（原卷此处题干缺失）</div>`;
          } else if (ref && (ref.answer || (ref.answer_points && ref.answer_points.length))) {
            const pts = (ref.answer_points && ref.answer_points.length)
              ? `<ul class="points-list">${ref.answer_points.map(p => `<li>${linkifyConcepts(p)}</li>`).join('')}</ul>`
              : '';
            ansHtml = `
              <button class="reveal-btn" id="btn-reveal-${cid}" onclick="toggleCardAnswer('${cid}')">
                <svg class="svg-icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                <span>查看参考答案</span>
              </button>
              <div class="answer-wrapper" id="ans-${cid}">
                <div class="answer-body">
                  <div style="font-weight:700;color:var(--cinnabar-deep);margin-bottom:6px;letter-spacing:.04em;">参考答案</div>
                  <div>${linkifyConcepts(ref.answer || '')}</div>
                  ${pts}
                </div>
              </div>
            `;
          } else {
            ansHtml = `<div style="font-size:12px;color:var(--ink-3);">（该题暂无匹配参考答案，可切到背诵模式按知识点查）</div>`;
          }

          return `
            <div class="card" id="card-${cid}">
              <div style="display:flex;gap:9px;align-items:flex-start;">
                <div style="font-weight:700;color:var(--cinnabar);flex-shrink:0;min-width:1.4em;">${q.no}.</div>
                <div style="flex:1;line-height:1.7;color:var(--ink-1);">${q.text}</div>
              </div>
              ${ansHtml}
            </div>
          `;
        }).join('');

        return head + `<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">${qs}</div>`;
      }).join('');
    }

    function goBack() {
      if (currentPaper) {
        navToExamPapers();
      } else {
        navToChapters();
      }
    }

    function toggleCardAnswer(cardId) {
      const wrapper = document.getElementById('ans-' + cardId);
      const btn = document.getElementById('btn-reveal-' + cardId);
      if (wrapper) {
        const isShow = wrapper.classList.toggle('show');
        if (btn) btn.style.display = isShow ? 'none' : 'flex';
      }
    }

    function checkChoice(cardId, selectedLetter, correctLetter) {
      const card = document.getElementById('card-' + cardId);
      if (!card) return;
      card.querySelectorAll('.option-item').forEach(opt => {
        if (opt.getAttribute('data-letter') === correctLetter) {
          opt.classList.add('correct');
        }
      });
      toggleCardAnswer(cardId);
    }

    function renderPracticeCards() {
      if (!selectedChapter || !globalData) return;
      const currentList = globalData.questions[currentSubjectId] || [];
      let list = currentList.filter(q => q.chapter === selectedChapter);

      if (currentMode === 'exam' || examOnly) {
        list = list.filter(q => q.exam_years && q.exam_years.length > 0);
      }

      if (currentSubjectId === 'culture') {
        // 文化要略题型顺序：主观题在前，填空 → 选择 → 判断 压轴
        const TYPE_ORDER = {
          '名词解释': 1,
          '简答题': 2,
          '论述题': 3,
          '填空题': 10,
          '单项选择题': 20,
          '选择题': 20,
          '判断题': 30
        };
        // 同题型内：真题/教材题优先，DeepSeek 推测题靠后
        const srcRank = q => (q.provenance === 'deepseek' ? 1 : 0);

        list.sort((a, b) => {
          const orderA = TYPE_ORDER[a.type] || 5;
          const orderB = TYPE_ORDER[b.type] || 5;
          if (orderA !== orderB) return orderA - orderB;
          if (srcRank(a) !== srcRank(b)) return srcRank(a) - srcRank(b);
          if (sortType === 'freq') return (b.importance_score || 0) - (a.importance_score || 0);
          return 0;
        });
      } else {
        if (sortType === 'freq') {
          list.sort((a, b) => (b.importance_score || 0) - (a.importance_score || 0));
        }
      }

      const container = document.getElementById('practiceContentList');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-3);">该模式下暂无匹配考点，请切换筛选或模式。</div>';
        return;
      }

      container.innerHTML = list.map((q, idx) => {
        const isExam = q.exam_years && q.exam_years.length > 0;
        const yearTag = isExam ? `<span class="pill pill-exam">真题 ${q.exam_years.join('/')}</span>` : '';
        const freqTag = q.frequency === '高频' ? `<span class="pill pill-score">高频必背</span>` : '';
        const typeTag = `<span class="pill pill-type">${q.type || '名词解释'}</span>`;
        const aiTag = (q.provenance === 'deepseek')
          ? `<span class="pill pill-ai">DeepSeek 推测</span>`
          : '';

        let optionsHtml = '';
        if (q.options && q.options.length > 0) {
          const correctLetter = (q.answer || '').trim().charAt(0);
          optionsHtml = `
            <div class="options-group">
              ${q.options.map(opt => {
                const letter = opt.trim().charAt(0);
                return `
                  <div class="option-item" data-letter="${letter}" onclick="checkChoice('${q.id}', '${letter}', '${correctLetter}')">
                    ${opt}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        let answerText = q.answer || '';
        const pointsArray = q.answer_points || [];

        if (currentMode === 'cloze' && q.blank_keys && q.blank_keys.length > 0) {
          q.blank_keys.forEach(k => {
            if (k && k.length > 1) {
              const r = new RegExp(k, 'g');
              answerText = answerText.replace(r, `<span class="blank-mask" onclick="this.classList.toggle('revealed')">${k}</span>`);
            }
          });
        } else {
          answerText = linkifyConcepts(answerText);
        }

        const pointsHtml = pointsArray.length > 0
          ? `<ul class="points-list">${pointsArray.map(p => `<li>${currentMode === 'recite' ? linkifyConcepts(p) : p}</li>`).join('')}</ul>`
          : '';

        const defaultShow = (currentMode === 'cloze');

        return `
          <div class="card" id="card-${q.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div class="stem-title">${idx + 1}. ${q.stem}</div>
              <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:52%;">
                ${typeTag}
                ${yearTag}
                ${freqTag}
                ${aiTag}
              </div>
            </div>
            <div style="font-size:12px;color:var(--ink-3);letter-spacing:.02em;">${q.section || ''}</div>

            ${optionsHtml}

            ${!defaultShow ? `
              <button class="reveal-btn" id="btn-reveal-${q.id}" onclick="toggleCardAnswer('${q.id}')">
                <svg class="svg-icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                <span>查看参考答案与采分点</span>
              </button>
            ` : ''}

            <div class="answer-wrapper ${defaultShow ? 'show' : ''}" id="ans-${q.id}">
              <div class="answer-body">
                <div style="font-weight:700;color:var(--cinnabar-deep);margin-bottom:6px;letter-spacing:.04em;">参考答案</div>
                <div>${answerText}</div>
                ${pointsHtml}
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:9px;border-top:1px dashed var(--rule-soft);">
              <span style="font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;">考频加权 ${q.importance_score}</span>
              <button class="chip" onclick="this.classList.toggle('active')">
                <svg class="svg-icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
                <span>已掌握</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
