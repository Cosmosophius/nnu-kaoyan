<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE3">
<title>汉硕专业课 · 考研知识图谱</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root{
    --paper:#F5EFE3;
    --paper-card:#FCF8EF;
    --paper-raise:#FFFCF5;
    --paper-sunk:#EFE8DA;
    --ink:#141414;
    --ink-1:#3A352E;
    --ink-2:#5A544B;
    --ink-3:#8C8578;
    --ink-4:#B5AD9E;
    --cinnabar:#C03024;
    --cinnabar-deep:#9E2519;
    --cinnabar-wash:#F7E4E0;
    --gold:#A8894F;
    --gold-wash:#F3EAD8;
    --bamboo:#4A6B52;
    --bamboo-wash:#E6EDE6;
    --rule:#DED5C4;
    --rule-soft:#E8E0D1;
    --r-s:4px;
    --r-m:7px;
    --r-l:11px;
    --shadow-1:0 1px 2px rgba(60,48,30,.06);
    --shadow-2:0 -4px 18px rgba(60,48,30,.13);
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    /* 界面框架尺寸：全部压缩 */
    --h-bar:40px;
    --h-dock:44px;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#16150F;
      --paper-card:#1F1D16;
      --paper-raise:#26241B;
      --paper-sunk:#12110C;
      --ink:#F0E9DA;
      --ink-1:#DCD4C3;
      --ink-2:#B8AF9C;
      --ink-3:#8A8272;
      --ink-4:#5E574A;
      --cinnabar:#D8503F;
      --cinnabar-deep:#E8776A;
      --cinnabar-wash:#3A211C;
      --gold:#C6A468;
      --gold-wash:#332C1D;
      --bamboo:#7FA989;
      --bamboo-wash:#1E2A21;
      --rule:#332F26;
      --rule-soft:#2A2721;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-2:0 -4px 18px rgba(0,0,0,.55);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;padding:0;
    font-family:var(--serif);
    background:var(--paper);
    color:var(--ink-1);
    overflow:hidden;display:flex;flex-direction:column;
    letter-spacing:.012em;
    background-image:repeating-linear-gradient(92deg,
      rgba(160,150,128,.02) 0 1px,transparent 1px 3px);
  }
  .svg-icon{width:20px;height:20px;fill:currentColor;vertical-align:middle;display:block;}

  /* ============ 顶栏：单行 40px，学科切换内嵌 ============ */
  .top-bar{
    height:var(--h-bar);flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:0 12px;
    background:var(--ink);color:#F5EFE3;
    position:relative;z-index:120;
  }
  .top-bar::after{
    content:'';position:absolute;left:0;right:0;bottom:0;
    height:1.5px;background:var(--cinnabar);
  }
  .tb-back{
    width:26px;height:26px;flex:0 0 auto;border:none;border-radius:var(--r-s);
    background:transparent;color:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .tb-back:active{background:rgba(245,239,227,.15);}
  .tb-back .svg-icon{width:18px;height:18px;}

  .tb-title{
    font-size:13.5px;font-weight:700;letter-spacing:.07em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:0 1 auto;min-width:0;color:#F5EFE3;
  }

  /* 学科切换：紧凑文字段，无边框无底色 */
  .subject-switch{display:flex;align-items:center;gap:2px;margin-left:auto;flex:0 0 auto;}
  .subject-btn{
    border:none;background:transparent;cursor:pointer;
    font-family:var(--serif);font-size:12px;font-weight:600;
    letter-spacing:.05em;color:rgba(245,239,227,.5);
    padding:4px 8px;border-radius:var(--r-s);
    transition:color .16s,background .16s;
    white-space:nowrap;
  }
  .subject-btn.active{color:#F5EFE3;background:rgba(192,48,36,.9);}
  .subject-btn:active{background:rgba(245,239,227,.12);}

  .tb-stat{
    flex:0 0 auto;font-size:10.5px;font-weight:600;letter-spacing:.03em;
    color:rgba(240,201,195,.85);white-space:nowrap;
    padding-left:9px;margin-left:2px;
    border-left:1px solid rgba(245,239,227,.18);
  }

  /* ============ 筛选栏：34px 细条，粘在内容顶部 ============ */
  .filter-bar{
    height:34px;flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:0 14px;overflow-x:auto;white-space:nowrap;
    background:var(--paper-card);
    border-bottom:1px solid var(--rule-soft);
    scrollbar-width:none;z-index:90;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-bar[hidden]{display:none;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    height:23px;padding:0 9px;border-radius:var(--r-s);
    border:1px solid var(--rule);background:transparent;color:var(--ink-3);
    font-family:var(--serif);font-size:11.5px;font-weight:600;letter-spacing:.02em;
    cursor:pointer;transition:all .16s;flex:0 0 auto;
  }
  .chip .svg-icon{width:12px;height:12px;}
  .chip.active{background:var(--cinnabar-wash);color:var(--cinnabar-deep);border-color:rgba(192,48,36,.34);}

  /* ============ 内容视口 ============ */
  .view-viewport{flex:1 1 auto;position:relative;overflow:hidden;min-height:0;}
  .view-screen{
    position:absolute;inset:0;
    overflow-y:auto;overflow-x:hidden;
    padding:18px 22px calc(var(--h-dock) + 22px);
    display:flex;flex-direction:column;gap:11px;
    transition:transform .26s cubic-bezier(.2,0,0,1),opacity .2s ease;
    will-change:transform,opacity;overscroll-behavior:contain;
  }
  .view-screen.hidden-left{transform:translate3d(-16%,0,0);opacity:0;pointer-events:none;}
  .view-screen.hidden-right{transform:translate3d(100%,0,0);opacity:0;pointer-events:none;}
  .view-screen::-webkit-scrollbar{width:5px;}
  .view-screen::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:3px;opacity:.5;}
  .view-screen::-webkit-scrollbar-track{background:transparent;}

  /* 内容列：文档式窄栏，平板横屏下更宽 */
  .col{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:11px;}
  @media (min-width:1100px){
    .col{max-width:1080px;}
  }

  .hint-line{
    font-size:11.5px;color:var(--ink-3);
    padding:0 1px 2px;letter-spacing:.06em;
    display:flex;align-items:center;gap:8px;
  }
  .hint-line::after{content:'';flex:1;height:1px;background:var(--rule-soft);}

  /* ============ 章节卡 ============ */
  .chapter-card{
    position:relative;background:var(--paper-card);
    border:1px solid var(--rule);border-radius:var(--r-m);
    padding:12px 15px 12px 17px;
    display:flex;flex-direction:column;gap:7px;
    cursor:pointer;box-shadow:var(--shadow-1);
    transition:background .15s,box-shadow .15s,transform .15s;
    overflow:hidden;
  }
  .chapter-card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;
    background:var(--cinnabar);opacity:.8;
  }
  .chapter-card:active{background:var(--paper-sunk);box-shadow:none;transform:scale(.995);}
  .ch-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ch-title{
    font-size:14.5px;font-weight:700;line-height:1.42;
    color:var(--ink);letter-spacing:.02em;
  }
  .ch-sub{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.02em;}
  .ch-arrow{flex:0 0 auto;color:var(--ink-4);margin-top:2px;}
  .ch-arrow .svg-icon{width:15px;height:15px;}
  .ch-meta-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}

  /* 章节列表：平板横屏双栏，消除手机感 */
  #chaptersList,#examPapersList{
    display:grid;gap:10px;
    grid-template-columns:1fr;
  }
  @media (min-width:900px){
    #chaptersList,#examPapersList{grid-template-columns:1fr 1fr;}
  }
  @media (min-width:1400px){
    #chaptersList,#examPapersList{grid-template-columns:repeat(3,1fr);}
  }

  /* ============ 标签 ============ */
  .pill{
    font-size:10.5px;padding:2px 7px;border-radius:var(--r-s);
    font-weight:600;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:3px;
    border:1px solid transparent;white-space:nowrap;line-height:1.5;
  }
  .pill-exam{background:var(--cinnabar-wash);color:var(--cinnabar-deep);border-color:rgba(192,48,36,.3);}
  .pill-sec{background:var(--gold-wash);color:var(--gold);border-color:rgba(168,137,79,.3);}
  .pill-score{background:var(--paper-sunk);color:var(--ink-2);border-color:var(--rule);}
  .pill-type{background:transparent;color:var(--ink-3);border-color:var(--rule);}
  .pill-ai{background:transparent;color:var(--gold);border:1px dashed rgba(168,137,79,.7);}
  .sec-tag{
    font-size:10.5px;color:var(--ink-3);background:var(--paper-sunk);
    padding:2px 6px;border-radius:var(--r-s);
    border:1px solid var(--rule-soft);letter-spacing:.02em;
  }
  .section-pills-flow{display:flex;flex-wrap:wrap;gap:4px;}

  /* ============ 题目卡 ============ */
  .card{
    position:relative;background:var(--paper-card);
    border:1px solid var(--rule);border-radius:var(--r-m);
    padding:14px 16px;display:flex;flex-direction:column;gap:9px;
    box-shadow:var(--shadow-1);
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .stem-title{
    font-size:15px;font-weight:700;line-height:1.68;
    color:var(--ink);letter-spacing:.015em;flex:1;min-width:0;
  }
  .stem-no{font-weight:700;color:var(--cinnabar-deep);flex:0 0 auto;margin-right:5px;}
  .card-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:46%;}
  .card-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;}

  .options-group{display:flex;flex-direction:column;gap:5px;margin:2px 0;}
  .option-item{
    padding:8px 11px;border-radius:var(--r-s);
    border:1px solid var(--rule);background:var(--paper-raise);
    font-size:13.5px;line-height:1.55;color:var(--ink-1);
    cursor:pointer;transition:all .14s;letter-spacing:.015em;
  }
  .option-item:active{background:var(--paper-sunk);}
  .option-item.correct{
    background:var(--bamboo-wash);color:var(--bamboo);
    border-color:rgba(74,107,82,.4);font-weight:700;
  }

  .answer-wrapper{display:none;padding-top:10px;border-top:1px dashed var(--rule);animation:fadeIn .2s ease;}
  .answer-wrapper.show{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}
  .answer-label{font-weight:700;color:var(--cinnabar-deep);margin-bottom:4px;letter-spacing:.05em;font-size:12.5px;}
  .answer-body{font-size:14px;line-height:1.9;color:var(--ink-2);letter-spacing:.015em;}
  .points-list{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;}
  .points-list li{line-height:1.8;}

  .concept-link{
    display:inline;color:var(--cinnabar-deep);background:var(--cinnabar-wash);
    font-weight:700;cursor:pointer;padding:0 3px;border-radius:2px;
    border-bottom:1px dotted var(--cinnabar);letter-spacing:.01em;
  }
  .concept-link:active{background:var(--cinnabar);color:#FFF8F2;border-bottom-color:transparent;}

  .blank-mask{
    display:inline-block;background:var(--gold-wash);color:transparent;
    padding:0 7px;border-radius:2px;margin:0 1px;cursor:pointer;
    border-bottom:1.5px solid var(--gold);user-select:none;
  }
  .blank-mask.revealed{background:var(--bamboo-wash);color:var(--bamboo);border-bottom-color:transparent;font-weight:700;}

  .reveal-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;height:32px;border-radius:var(--r-s);
    background:var(--paper-sunk);color:var(--ink-2);
    border:1px solid var(--rule);font-family:var(--serif);
    font-size:12px;font-weight:600;letter-spacing:.06em;
    cursor:pointer;transition:all .16s;
  }
  .reveal-btn .svg-icon{width:14px;height:14px;}
  .reveal-btn:active{background:var(--cinnabar-wash);color:var(--cinnabar-deep);border-color:rgba(192,48,36,.3);}

  .card-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:7px;border-top:1px dashed var(--rule-soft);
  }
  .card-foot-meta{font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;}

  /* ============ 底栏：细条 + 下滑隐藏 ============ */
  .mode-dock{
    position:fixed;left:0;right:0;bottom:0;height:var(--h-dock);
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:rgba(252,248,239,.94);
    border-top:1px solid var(--rule);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:130;
    transition:transform .24s cubic-bezier(.2,0,0,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mode-dock.tucked{transform:translate3d(0,100%,0);}
  .dock-btn{
    display:flex;align-items:center;gap:6px;
    height:30px;padding:0 14px;border-radius:var(--r-s);
    border:none;background:transparent;color:var(--ink-3);
    font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.05em;
    cursor:pointer;transition:color .16s,background .16s;
  }
  .dock-btn .svg-icon{width:15px;height:15px;}
  .dock-btn.active{color:var(--cinnabar-deep);background:var(--cinnabar-wash);}

  @media (prefers-color-scheme: dark){
    .mode-dock{background:rgba(31,29,22,.94);}
  }

  /* ============ 概念抽屉 ============ */
  .sheet-scrim{
    position:fixed;inset:0;background:rgba(20,20,20,.4);z-index:500;
    opacity:0;pointer-events:none;transition:opacity .22s ease;
    backdrop-filter:blur(1.5px);
  }
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .bottom-sheet{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--paper-card);border-top:2px solid var(--cinnabar);
    border-top-left-radius:var(--r-l);border-top-right-radius:var(--r-l);
    box-shadow:var(--shadow-2);max-height:78vh;
    display:flex;flex-direction:column;
    transform:translate3d(0,100%,0);
    transition:transform .28s cubic-bezier(.1,.9,.2,1);
    z-index:501;max-width:720px;margin:0 auto;
  }
  .bottom-sheet.open{transform:translate3d(0,0,0);}
  .sheet-drag-handle{width:30px;height:3px;border-radius:2px;background:var(--ink-4);margin:9px auto 4px;flex-shrink:0;}
  .sheet-header{
    padding:4px 16px 9px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--rule);flex-shrink:0;
  }
  .sheet-title{font-size:16px;font-weight:700;color:var(--cinnabar-deep);letter-spacing:.04em;}
  .sheet-body{
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;font-size:14px;line-height:1.9;color:var(--ink-2);
    letter-spacing:.015em;
  }
  .sheet-history-bar{
    display:flex;gap:5px;align-items:center;font-size:11px;color:var(--ink-3);
    padding:4px 18px;flex-shrink:0;border-bottom:1px solid var(--rule-soft);
    letter-spacing:.02em;overflow-x:auto;white-space:nowrap;
  }
  .icon-btn{
    width:30px;height:30px;border-radius:var(--r-s);border:none;background:transparent;
    color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:active{background:var(--paper-sunk);}
  .icon-btn .svg-icon{width:17px;height:17px;}

  .paper-divider{
    display:flex;align-items:center;gap:9px;color:var(--ink-3);
    font-size:11px;letter-spacing:.12em;font-weight:600;margin:4px 0 1px;
  }
  .paper-divider::before,.paper-divider::after{content:'';flex:1;height:1px;background:var(--rule-soft);}

  /* 试卷大题分区头 */
  .sec-head{
    padding:7px 11px;border-left:2.5px solid var(--cinnabar);
    background:var(--paper-sunk);border-radius:var(--r-s);
  }
  .sec-head-name{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.03em;}
  .sec-head-score{font-size:10.5px;color:var(--ink-3);margin-top:1px;}
</style>
</head>
<body>

  <!-- 顶栏：单行 40px -->
  <header class="top-bar">
    <button class="tb-back" id="backBtn" style="display:none;" onclick="goBack()">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="tb-title" id="appHeaderTitle">汉硕知识图谱</div>
    <nav class="subject-switch">
      <button class="subject-btn active" id="subBtn-yinlun" onclick="switchSubject('yinlun')">引论</button>
      <button class="subject-btn" id="subBtn-xdhy" onclick="switchSubject('xdhy')">现汉</button>
      <button class="subject-btn" id="subBtn-culture" onclick="switchSubject('culture')">要略</button>
    </nav>
    <div class="tb-stat" id="globalStatBadge">2131</div>
  </header>

  <!-- 筛选栏：34px -->
  <div class="filter-bar" id="practiceFilterBar" hidden>
    <button class="chip active" id="sortFreqBtn" onclick="toggleSort('freq')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>真题考频</span>
    </button>
    <button class="chip" id="sortSeqBtn" onclick="toggleSort('seq')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span>教材顺序</span>
    </button>
    <button class="chip" id="filterExamOnlyBtn" onclick="toggleExamOnly()">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>仅看真题</span>
    </button>
  </div>

  <!-- 内容视口 -->
  <div class="view-viewport">
    <div class="view-screen" id="chapterScreen">
      <div class="col">
        <div class="hint-line" id="chapterSubtitle">点击章节进入练习</div>
        <div id="chaptersList"></div>
      </div>
    </div>

    <div class="view-screen hidden-right" id="examScreen">
      <div class="col">
        <div class="hint-line" id="examSubtitle">南师大历年真题原卷</div>
        <div id="examPapersList"></div>
      </div>
    </div>

    <div class="view-screen hidden-right" id="practiceScreen">
      <div class="col" id="practiceContentList"></div>
    </div>
  </div>

  <!-- 底栏：细条 -->
  <nav class="mode-dock" id="modeDock">
    <button class="dock-btn active" id="navRecite" onclick="setMode('recite')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm-1 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
      <span>背诵</span>
    </button>
    <button class="dock-btn" id="navCloze" onclick="setMode('cloze')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span>挖空</span>
    </button>
    <button class="dock-btn" id="navExam" onclick="setMode('exam')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>真题</span>
    </button>
  </nav>

  <!-- 概念嵌套抽屉 -->
  <div class="sheet-scrim" id="sheetScrim" onclick="closeConceptSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-header">
      <div style="display:flex;align-items:center;gap:6px;min-width:0;">
        <button class="icon-btn" id="sheetBackBtn" style="display:none;" onclick="popConceptHistory()">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="sheet-title" id="sheetTermTitle">概念词解</div>
      </div>
      <button class="icon-btn" onclick="closeConceptSheet()">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="sheet-history-bar" id="sheetBreadcrumb" style="display:none;"></div>
    <div class="sheet-body" id="sheetTermBody">正在检索概念释义…</div>
  </div>

<script>
  let globalData = null;
  let currentSubjectId = 'yinlun';
  let termDict = {};
  let questionMap = {};
  let selectedChapter = null;
  let currentMode = 'recite';
  let sortType = 'freq';
  let examOnly = false;
  let conceptHistory = [];
  let examPapers = [];
  let currentPaper = null;

  const TS = Date.now();
  Promise.all([
    fetch('./data/all_subjects_data.json?t=' + TS).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }),
    fetch('./data/term_index.json?t=' + TS).then(r => r.json()).catch(() => ({ terms: {} })),
    fetch('./data/exam_papers.json?t=' + TS).then(r => r.json()).catch(() => ({ papers: [] }))
  ]).then(([multiData, termData, paperData]) => {
    globalData = multiData;
    termDict = termData.terms || {};
    examPapers = (paperData && paperData.papers) || [];

    Object.values(globalData.questions).forEach(qList => {
      qList.forEach(q => {
        questionMap[q.id] = q;
        if (q.stem && !termDict[q.stem]) termDict[q.stem] = q.id;
      });
    });

    renderCurrentSubjectChapters();
  }).catch(err => {
    console.error('Data load error:', err);
    const chList = document.getElementById('chaptersList');
    if (chList) {
      chList.innerHTML = `
        <div style="text-align:center;padding:36px 16px;color:var(--cinnabar);">
          题库载入异常（${err.message}）<br><br>
          <button class="chip active" onclick="location.reload(true)">点击强制重试</button>
        </div>`;
    }
  });

  /* 底栏下滑隐藏 */
  (function () {
    const dock = document.getElementById('modeDock');
    let lastY = 0;
    document.querySelectorAll('.view-screen').forEach(sc => {
      sc.addEventListener('scroll', () => {
        const y = sc.scrollTop;
        if (y > 60 && y > lastY + 6) dock.classList.add('tucked');
        else if (y < lastY - 6 || y < 40) dock.classList.remove('tucked');
        lastY = y;
      }, { passive: true });
    });
  })();

  function switchSubject(subjectId) {
    currentSubjectId = subjectId;
    document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('subBtn-' + subjectId).classList.add('active');

    currentPaper = null;
    document.getElementById('examScreen').classList.add('hidden-right');

    if (currentMode === 'exam') setMode('recite');
    if (selectedChapter) navToChapters();
    renderCurrentSubjectChapters();
  }

  function renderCurrentSubjectChapters() {
    if (!globalData) return;
    const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
    if (!subInfo) return;

    document.getElementById('appHeaderTitle').innerText = subInfo.name;
    document.getElementById('globalStatBadge').innerText = subInfo.total;

    const dsByChapter = {};
    (globalData.questions[currentSubjectId] || []).forEach(q => {
      if (q.provenance === 'deepseek') {
        dsByChapter[q.chapter] = (dsByChapter[q.chapter] || 0) + 1;
      }
    });

    const container = document.getElementById('chaptersList');
    container.innerHTML = subInfo.chapters.map(ch => {
      const sectionsHtml = Object.entries(ch.sections).map(([sName, count]) =>
        `<span class="sec-tag">${sName} ${count}</span>`).join('');
      const dsCount = dsByChapter[ch.chapter] || 0;

      return `
        <div class="chapter-card" onclick="selectChapter('${ch.chapter.replace(/'/g, "\\'")}')">
          <div class="ch-header">
            <div style="min-width:0;">
              <div class="ch-title">${ch.chapter}</div>
            </div>
            <div class="ch-arrow">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
          </div>
          <div class="ch-meta-row">
            <span class="pill pill-score">${ch.total} 考点</span>
            ${ch.exam_count ? `<span class="pill pill-exam">真题 ${ch.exam_count}</span>` : ''}
            ${dsCount ? `<span class="pill pill-ai">DS ${dsCount}</span>` : ''}
          </div>
          <div class="section-pills-flow">${sectionsHtml}</div>
        </div>`;
    }).join('');
  }

  function linkifyConcepts(text) {
    if (!text) return '';
    const terms = Object.keys(termDict)
      .filter(t => t.length >= 2 && !['这是','一般','可以','进行','人们','一种','包括','如果','为了','中国','通过','主要'].includes(t))
      .sort((a, b) => b.length - a.length);
    if (terms.length === 0) return text;

    const parts = text.split(/(<[^>]+>)/g);
    const regex = new RegExp(`(${terms.slice(0, 450).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'g');

    return parts.map(part => {
      if (part.startsWith('<') && part.endsWith('>')) return part;
      return part.replace(regex, m =>
        `<span class="concept-link" onclick="event.stopPropagation();openConcept('${m.replace(/'/g, "\\'")}')">${m}</span>`);
    }).join('');
  }

  function openConcept(term) {
    conceptHistory.push(term);
    renderConceptView(term);
    document.getElementById('sheetScrim').classList.add('open');
    document.getElementById('bottomSheet').classList.add('open');
  }

  function renderConceptView(term) {
    const titleEl = document.getElementById('sheetTermTitle');
    const bodyEl = document.getElementById('sheetTermBody');
    const backBtn = document.getElementById('sheetBackBtn');
    const breadcrumb = document.getElementById('sheetBreadcrumb');

    titleEl.innerText = term;
    backBtn.style.display = conceptHistory.length > 1 ? 'flex' : 'none';

    if (conceptHistory.length > 1) {
      breadcrumb.style.display = 'flex';
      breadcrumb.innerText = conceptHistory.join(' › ');
    } else {
      breadcrumb.style.display = 'none';
    }

    const targetId = termDict[term];
    const q = targetId ? questionMap[targetId] : Object.values(questionMap).find(item => item.stem === term);

    if (q) {
      bodyEl.innerHTML = `
        <div style="margin-bottom:7px;display:flex;gap:4px;flex-wrap:wrap;">
          <span class="pill pill-score">${q.chapter}</span>
          <span class="pill pill-type">${q.type || '名词解释'}</span>
          ${q.frequency === '高频' ? '<span class="pill pill-exam">高频</span>' : ''}
        </div>
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;color:var(--ink);">${q.stem}</div>
        <div>${linkifyConcepts(q.answer)}</div>
        ${q.answer_points && q.answer_points.length
          ? `<div style="margin-top:11px;font-weight:700;color:var(--cinnabar-deep);font-size:12.5px;">核心采分点</div>
             <ul class="points-list">${q.answer_points.map(p => `<li>${linkifyConcepts(p)}</li>`).join('')}</ul>`
          : ''}`;
    } else {
      bodyEl.innerHTML = `<div style="color:var(--ink-3);padding:6px 0;">
        <b>${term}</b> 为汉硕专业课核心术语，建议在教材相应章节中理解其与前后概念的联系。
      </div>`;
    }
  }

  function popConceptHistory() {
    if (conceptHistory.length > 1) {
      conceptHistory.pop();
      renderConceptView(conceptHistory[conceptHistory.length - 1]);
    }
  }

  function closeConceptSheet() {
    document.getElementById('sheetScrim').classList.remove('open');
    document.getElementById('bottomSheet').classList.remove('open');
    conceptHistory = [];
  }

  function selectChapter(chapterName) {
    selectedChapter = chapterName;
    currentPaper = null;
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('appHeaderTitle').innerText = chapterName.split(' ')[0] + ' · 演练';
    document.getElementById('practiceFilterBar').hidden = false;

    document.getElementById('chapterScreen').classList.add('hidden-left');
    document.getElementById('examScreen').classList.add('hidden-right');
    document.getElementById('practiceScreen').classList.remove('hidden-right');
    document.getElementById('practiceScreen').scrollTop = 0;

    renderPracticeCards();
  }

  function navToChapters() {
    selectedChapter = null;
    currentPaper = null;
    document.getElementById('backBtn').style.display = 'none';
    const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
    document.getElementById('appHeaderTitle').innerText = subInfo ? subInfo.name : '汉硕知识图谱';
    document.getElementById('practiceFilterBar').hidden = true;

    document.getElementById('chapterScreen').classList.remove('hidden-left');
    document.getElementById('practiceScreen').classList.add('hidden-right');
    document.getElementById('examScreen').classList.add('hidden-right');
  }

  function toggleSort(type) {
    sortType = type;
    document.getElementById('sortFreqBtn').classList.toggle('active', type === 'freq');
    document.getElementById('sortSeqBtn').classList.toggle('active', type === 'seq');
    renderPracticeCards();
  }

  function toggleExamOnly() {
    examOnly = !examOnly;
    document.getElementById('filterExamOnlyBtn').classList.toggle('active', examOnly);
    renderPracticeCards();
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.dock-btn').forEach(el => el.classList.remove('active'));
    if (mode === 'recite') document.getElementById('navRecite').classList.add('active');
    if (mode === 'cloze')  document.getElementById('navCloze').classList.add('active');
    if (mode === 'exam')   document.getElementById('navExam').classList.add('active');

    if (mode === 'exam') { navToExamPapers(); return; }

    if (!selectedChapter && globalData) {
      const subInfo = globalData.subjects.find(s => s.id === currentSubjectId);
      if (subInfo && subInfo.chapters.length) selectChapter(subInfo.chapters[0].chapter);
    } else {
      renderPracticeCards();
    }
  }

  /* ---------- 真题：按试卷罗列 ---------- */
  function navToExamPapers() {
    selectedChapter = null;
    currentPaper = null;
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('practiceFilterBar').hidden = true;
    document.getElementById('appHeaderTitle').innerText = '南师大真题原卷';
    document.getElementById('globalStatBadge').innerText =
      examPapers.length + '份 · ' + examPapers.reduce((n, p) =>
        n + p.sections.reduce((m, s) => m + s.questions.length, 0), 0) + '题';

    renderExamPapers();

    document.getElementById('chapterScreen').classList.add('hidden-left');
    document.getElementById('practiceScreen').classList.add('hidden-right');
    document.getElementById('examScreen').classList.remove('hidden-right');
  }

  function renderExamPapers() {
    const box = document.getElementById('examPapersList');
    if (!examPapers.length) {
      box.innerHTML = '<div style="text-align:center;padding:36px;color:var(--ink-3);">暂未解析到真题试卷数据。</div>';
      return;
    }

    const byYear = {};
    examPapers.forEach(p => { (byYear[p.year] = byYear[p.year] || []).push(p); });
    const years = Object.keys(byYear).sort((a, b) => b - a);

    box.innerHTML = years.map(y => {
      const items = byYear[y].map(p => {
        const total = p.sections.reduce((n, s) => n + s.questions.length, 0);
        const is354 = p.code === '354';
        return `
          <div class="chapter-card" onclick="openPaper('${p.id}')">
            <div class="ch-header">
              <div style="min-width:0;">
                <div class="ch-title">${p.code} ${p.subject}</div>
                <div class="ch-sub">${p.sections.length} 个大题 · ${total} 道小题</div>
              </div>
              <span class="pill ${is354 ? 'pill-type' : 'pill-score'}">${p.code}</span>
            </div>
          </div>`;
      }).join('');

      return `
        <div style="grid-column:1/-1;" class="paper-divider">${y} 年</div>
        ${items}`;
    }).join('');
  }

  function openPaper(paperId) {
    const paper = examPapers.find(p => p.id === paperId);
    if (!paper) return;
    currentPaper = paper;
    currentMode = 'exam';

    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('appHeaderTitle').innerText = paper.year + ' · ' + paper.code;
    document.getElementById('practiceFilterBar').hidden = true;
    document.getElementById('globalStatBadge').innerText =
      paper.sections.reduce((n, s) => n + s.questions.length, 0) + '题';

    renderPaperView(paper);

    document.getElementById('examScreen').classList.add('hidden-right');
    document.getElementById('chapterScreen').classList.add('hidden-left');
    document.getElementById('practiceScreen').classList.remove('hidden-right');
    document.getElementById('practiceScreen').scrollTop = 0;
  }

  function renderPaperView(paper) {
    const container = document.getElementById('practiceContentList');
    let seq = 0;

    container.innerHTML = `
      <div class="card" style="background:var(--paper-sunk);border-color:var(--rule);">
        <div class="stem-title" style="font-size:14px;">${paper.title}</div>
        <div class="card-sub">按原卷大题顺序 · 共 ${paper.sections.length} 个大题</div>
      </div>
    ` + paper.sections.map(sec => {
      const head = `
        <div class="sec-head">
          <div class="sec-head-name">${sec.name}</div>
          ${sec.score ? `<div class="sec-head-score">${sec.score}</div>` : ''}
        </div>`;

      const qs = sec.questions.map(q => {
        seq += 1;
        const cid = 'p-' + paper.id + '-' + seq;
        const ref = q.ref || null;
        const missing = q.missing;

        let ansHtml = '';
        if (missing) {
          ansHtml = `<div class="card-sub">（原卷此处题干缺失）</div>`;
        } else if (ref && (ref.answer || (ref.answer_points && ref.answer_points.length))) {
          const pts = (ref.answer_points && ref.answer_points.length)
            ? `<ul class="points-list">${ref.answer_points.map(p => `<li>${linkifyConcepts(p)}</li>`).join('')}</ul>`
            : '';
          ansHtml = `
            <button class="reveal-btn" id="btn-reveal-${cid}" onclick="toggleCardAnswer('${cid}')">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              <span>查看参考答案</span>
            </button>
            <div class="answer-wrapper" id="ans-${cid}">
              <div class="answer-body">
                <div class="answer-label">参考答案</div>
                <div>${linkifyConcepts(ref.answer || '')}</div>
                ${pts}
              </div>
            </div>`;
        } else {
          ansHtml = `<div class="card-sub">（暂无匹配参考答案，可切到背诵模式按知识点查）</div>`;
        }

        return `
          <div class="card" id="card-${cid}">
            <div class="card-head">
              <div class="stem-title"><span class="stem-no">${q.no}.</span>${q.text}</div>
            </div>
            ${ansHtml}
          </div>`;
      }).join('');

      return head + qs;
    }).join('');
  }

  function goBack() {
    if (currentPaper) navToExamPapers();
    else navToChapters();
  }

  function toggleCardAnswer(cardId) {
    const wrapper = document.getElementById('ans-' + cardId);
    const btn = document.getElementById('btn-reveal-' + cardId);
    if (wrapper) {
      const isShow = wrapper.classList.toggle('show');
      if (btn) btn.style.display = isShow ? 'none' : 'flex';
    }
  }

  function checkChoice(cardId, selectedLetter, correctLetter) {
    const card = document.getElementById('card-' + cardId);
    if (!card) return;
    card.querySelectorAll('.option-item').forEach(opt => {
      if (opt.getAttribute('data-letter') === correctLetter) opt.classList.add('correct');
    });
    toggleCardAnswer(cardId);
  }

  function renderPracticeCards() {
    if (!selectedChapter || !globalData) return;
    const currentList = globalData.questions[currentSubjectId] || [];
    let list = currentList.filter(q => q.chapter === selectedChapter);

    if (currentMode === 'exam' || examOnly) {
      list = list.filter(q => q.exam_years && q.exam_years.length > 0);
    }

    if (currentSubjectId === 'culture') {
      const TYPE_ORDER = {
        '名词解释': 1, '简答题': 2, '论述题': 3,
        '填空题': 10, '单项选择题': 20, '选择题': 20, '判断题': 30
      };
      const srcRank = q => (q.provenance === 'deepseek' ? 1 : 0);
      list.sort((a, b) => {
        const oa = TYPE_ORDER[a.type] || 5, ob = TYPE_ORDER[b.type] || 5;
        if (oa !== ob) return oa - ob;
        if (srcRank(a) !== srcRank(b)) return srcRank(a) - srcRank(b);
        if (sortType === 'freq') return (b.importance_score || 0) - (a.importance_score || 0);
        return 0;
      });
    } else if (sortType === 'freq') {
      list.sort((a, b) => (b.importance_score || 0) - (a.importance_score || 0));
    }

    const container = document.getElementById('practiceContentList');
    if (!list || list.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:36px;color:var(--ink-3);">该模式下暂无匹配考点。</div>';
      return;
    }

    container.innerHTML = list.map((q, idx) => {
      const isExam = q.exam_years && q.exam_years.length > 0;
      const yearTag = isExam ? `<span class="pill pill-exam">真题 ${q.exam_years.join('/')}</span>` : '';
      const freqTag = q.frequency === '高频' ? `<span class="pill pill-score">高频</span>` : '';
      const typeTag = `<span class="pill pill-type">${q.type || '名词解释'}</span>`;
      const aiTag = (q.provenance === 'deepseek') ? `<span class="pill pill-ai">DS 推测</span>` : '';

      let optionsHtml = '';
      if (q.options && q.options.length > 0) {
        const correctLetter = (q.answer || '').trim().charAt(0);
        optionsHtml = `<div class="options-group">${q.options.map(opt => {
          const letter = opt.trim().charAt(0);
          return `<div class="option-item" data-letter="${letter}" onclick="checkChoice('${q.id}','${letter}','${correctLetter}')">${opt}</div>`;
        }).join('')}</div>`;
      }

      let answerText = q.answer || '';
      let pointsArray = q.answer_points || [];

      if (currentMode === 'cloze' && q.blank_keys && q.blank_keys.length > 0) {
        q.blank_keys.forEach(k => {
          if (k && k.length > 1) {
            const r = new RegExp(k, 'g');
            answerText = answerText.replace(r, `<span class="blank-mask" onclick="this.classList.toggle('revealed')">${k}</span>`);
          }
        });
      } else {
        answerText = linkifyConcepts(answerText);
      }

      const pointsHtml = pointsArray.length > 0
        ? `<ul class="points-list">${pointsArray.map(p => `<li>${currentMode === 'recite' ? linkifyConcepts(p) : p}</li>`).join('')}</ul>`
        : '';

      const defaultShow = (currentMode === 'cloze');

      return `
        <div class="card" id="card-${q.id}">
          <div class="card-head">
            <div class="stem-title"><span class="stem-no">${idx + 1}.</span>${q.stem}</div>
            <div class="card-tags">${typeTag}${yearTag}${freqTag}${aiTag}</div>
          </div>
          ${q.section ? `<div class="card-sub">${q.section}</div>` : ''}
          ${optionsHtml}
          ${!defaultShow ? `
            <button class="reveal-btn" id="btn-reveal-${q.id}" onclick="toggleCardAnswer('${q.id}')">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              <span>查看参考答案</span>
            </button>` : ''}
          <div class="answer-wrapper ${defaultShow ? 'show' : ''}" id="ans-${q.id}">
            <div class="answer-body">
              <div class="answer-label">参考答案</div>
              <div>${answerText}</div>
              ${pointsHtml}
            </div>
          </div>
          <div class="card-foot">
            <span class="card-foot-meta">考频加权 ${q.importance_score}</span>
            <button class="chip" onclick="this.classList.toggle('active')">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
              <span>已掌握</span>
            </button>
          </div>
        </div>`;
    }).join('');
  }
</script>
</body>
</html>
